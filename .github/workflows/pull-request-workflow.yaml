name: A workflow for my my Hello World file
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - workflow-action

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]

    steps:
      - uses: actions/checkout@v5
      - name: Use NodeJs ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm ci
      - run: npm test